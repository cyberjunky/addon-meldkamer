name: Meldkamer
version: "0.0.99"
slug: "meldkamer"
description: "P2000 FLEX pager decoder dashboard for Home Assistant - decode Dutch emergency services messages using RTL-SDR or HackRF"
url: https://github.com/cyberjunky/addon-meldkamer
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
map:
  - config:rw
  - share:rw
udev: true
usb: true
host_network: false
ports:
  5000/tcp: null
ports_description:
  5000/tcp: P2000 TCP broadcast server for integrations (optional)
ingress: true
ingress_port: 8099
panel_icon: mdi:headset
panel_title: Meldkamer
homeassistant_api: true
hassio_api: true
services:
  - mqtt:want

options:
  receiver:
    type: rtl-sdr
    network_host: ""
    network_port: 1234
    sdr_gain: 40
    ppm_correction: 0
    hackrf_lna_gain: 40
    hackrf_vga_gain: 30
    hackrf_amp_enable: true
  geocoding:
    enabled: false
    opencage_token: ""
  sensors_enabled: false
  sensors:
    - name: Dordrecht e.o
      icon: mdi:sheep
      radius_km: 20
      center_lat: 51.8133
      center_lon: 4.6739
    - name: GRIP
      icon: mdi:magnify
      text_contains: "GRIP"
    - name: Brandweer
      icon: mdi:fire-truck
      disciplines: "Brandweer"
    - name: Schiphol
      icon: mdi:airplane
      radius_km: 3
      center_lat: 52.3086
      center_lon: 4.7639
      priorities: "P1, A1"
  mqtt:
    enabled: false
    host: ""
    port: 1883
    user: ""
    password: ""
    client_id: p2000_rtlsdr
    base_topic: p2000_rtlsdr
    ha_autodiscovery: true
    ha_autodiscovery_topic: homeassistant
    retain: false
    tls_enabled: false
  log_level: info

schema:
  receiver:
    type: list(rtl-sdr|hackrf|soapysdr|network)?
    network_host: str?
    network_port: int?
    sdr_gain: int?
    ppm_correction: int?
    hackrf_lna_gain: int?
    hackrf_vga_gain: int?
    hackrf_amp_enable: bool?
  geocoding:
    enabled: bool
    opencage_token: password
  sensors_enabled: bool?
  sensors:
    - name: str
      icon: str?
      disciplines: str?
      cities: str?
      capcodes: str?
      priorities: str?
      text_contains: str?
      region: str?
      radius_km: float?
      center_lat: float?
      center_lon: float?
      mqtt_id: str?
  mqtt:
    enabled: bool?
    host: str?
    port: int?
    user: str?
    password: password?
    client_id: str?
    base_topic: str?
    ha_autodiscovery: bool?
    ha_autodiscovery_topic: str?
    retain: bool?
    tls_enabled: bool?
    tls_ca: str?
    tls_cert: str?
    tls_keyfile: str?
    tls_insecure: bool?
  log_level: list(debug|info|warning|error)?
